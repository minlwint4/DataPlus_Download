name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Install Flet 0.25.0
        run: pip install flet==0.25.0 flet-cli==0.25.0 requests

      - name: Prepare App Icon
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            echo "Icon ready in assets/icon.png ✅"
          fi

      - name: Setup Custom Template (Fix Dependencies & Inject dataplus scheme)
        run: |
          git clone https://github.com/flet-dev/flet-build-template.git custom-template
          cd custom-template
          git checkout 0.25.0 || git checkout v0.25.0 || true
          cd ..

          python -c '
          import glob

          # 1. YAML Format မပျက်စေဘဲ Dependency များကိုသာ အတိအကျ အစားထိုးခြင်း
          for pub in glob.glob("custom-template/**/pubspec.yaml", recursive=True):
              with open(pub, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("serious_python: ^0.7.0", "serious_python: 0.7.0")
              content = content.replace("flutter_native_splash: ^2.4.1", "flutter_native_splash: 2.3.7")
              with open(pub, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Successfully tuned dependencies safely in:", pub)

          # 2. dataplus:// Browsable Scheme ကို AndroidManifest.xml ထဲသို့ ထည့်သွင်းခြင်း
          for manifest in glob.glob("custom-template/**/AndroidManifest.xml", recursive=True):
              with open(manifest, "r", encoding="utf-8") as f:
                  data = f.read()
              scheme_filter = """
                      <!-- DATA PLUS Browsable Scheme -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="dataplus" />
                      </intent-filter>
              """
              if "dataplus" not in data and "</activity>" in data:
                  data = data.replace("</activity>", f"{scheme_filter}\n        </activity>", 1)
                  with open(manifest, "w", encoding="utf-8") as f:
                      f.write(data)
                  print("Injected Browsable dataplus scheme into:", manifest)
          '

          cd custom-template
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Safely tune dependencies and inject dataplus scheme" || true
          cd ..

      - name: Build Raw APK
        run: echo "y" | flet build apk --template ./custom-template

      - name: Sign APK with Release Key (V1, V2, V3)
        run: |
          RAW_APK=$(find build/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"

          # 1. Release Keystore အသစ် ဖန်တီးခြင်း
          keytool -genkeypair -v -keystore release.jks -alias dataplus -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "dataplus123" -keypass "dataplus123" \
            -dname "CN=DATA PLUS Downloader, OU=DataPlus, O=DataPlus, L=Yangon, ST=Yangon, C=MM"

          # 2. Android Build Tools ရှာဖွေခြင်း
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # 3. မူရင်း Signature အဟောင်းများ ရှင်းထုတ်ခြင်း
          zip -d "$RAW_APK" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" || true

          # 4. Zipalign ပြုလုပ်ခြင်း
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_APK" build/apk/DataPlus_aligned.apk

          # 5. V1, V2, V3 Schemes များဖြင့် Sign ထိုးခြင်း
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:dataplus123 --key-pass pass:dataplus123 \
            --ks-key-alias dataplus \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/apk/DataPlus_Downloader.apk build/apk/DataPlus_aligned.apk

          # 6. Signature အောင်မြင်မှု စစ်ဆေးခြင်း
          $BUILD_TOOLS_DIR/apksigner verify --verbose build/apk/DataPlus_Downloader.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: build/apk/DataPlus_Downloader.apk
